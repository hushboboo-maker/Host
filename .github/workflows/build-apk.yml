
name: Build OpenChat APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip openchat-android-server.zip -d extracted

      - name: Build APK
        run: |
          cd "$(dirname "$(find extracted -name gradlew -type f -print -quit)")"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenChat-debug-apk
          path: extracted/OpenChatAndroid/app/build/outputs/apk/debug/app-debug.apk
          
